# Shipyard on a single homelab server.
#
#   cp config/shipyard.env.example .env   # then edit
#   docker compose up -d --build
#
# Data lives in ${SHIPYARD_HOST_DATA:-/var/lib/shipyard} on the host. Back it up
# (it contains the SQLite database and database/secret.key).

name: shipyard

services:
  shipyard:
    build: &shipyard-build
      context: .
      args:
        # Shown in Settings → Shipyard updates; scripts/self-update.sh sets it.
        SHIPYARD_COMMIT: ${SHIPYARD_COMMIT:-}
    image: shipyard:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SHIPYARD_DATA_DIR: /var/lib/shipyard
      SHIPYARD_DOCKER_NETWORK: shipyard
      SHIPYARD_CADDY_ADMIN_URL: unix:/run/caddy-admin/admin.sock
      SHIPYARD_PLATFORM_UPSTREAM: shipyard:8080
      SHIPYARD_HTTPS: ${SHIPYARD_HTTPS:-false}
    volumes:
      # The platform drives Docker. Hosted applications never get this socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SHIPYARD_HOST_DATA:-/var/lib/shipyard}:/var/lib/shipyard
      - caddy-admin:/run/caddy-admin
      # This checkout, read-only: lets Shipyard check for and apply its own updates.
      - .:/opt/shipyard/source:ro
    ports:
      # Direct access to the UI on the LAN (optional when SHIPYARD_PLATFORM_DOMAIN is set).
      - "${SHIPYARD_UI_PORT:-8080}:8080"
    networks: [shipyard]
    depends_on: [caddy]

  # mDNS responder: publishes the .local hostnames of running applications (devstick.local, …)
  # on the LAN. It needs the host network for multicast; Shipyard tells it which names to publish
  # through the mdns/ data directory. Turn publishing off with SHIPYARD_MDNS=false.
  mdns:
    build: *shipyard-build   # same image as shipyard (a cache hit), so nothing is pulled
    image: shipyard:latest
    restart: unless-stopped
    network_mode: host
    environment:
      # Optional: the address to answer with (default: this server's address on the asking client's network).
      SHIPYARD_MDNS_ADDRESS: ${SHIPYARD_MDNS_ADDRESS:-}
    entrypoint: ["java", "-Xmx48m", "-Dloader.main=dev.shipyard.mdns.MdnsResponder", "-cp", "/opt/shipyard/shipyard.jar",
                 "org.springframework.boot.loader.launch.PropertiesLauncher", "/var/lib/shipyard/mdns"]
    volumes:
      - ${SHIPYARD_HOST_DATA:-/var/lib/shipyard}/mdns:/var/lib/shipyard/mdns
    healthcheck:
      # The responder writes a heartbeat every 10 seconds.
      test: ["CMD-SHELL", "find /var/lib/shipyard/mdns/status -mmin -1 | grep -q ."]
      interval: 30s
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SHIPYARD_HTTPS: ${SHIPYARD_HTTPS:-false}
    # Start from the last generated configuration; on first boot (or when switching
    # to plain HTTP from an old TLS Caddyfile) use the bootstrap file.
    command: >
      sh -c 'f=/etc/shipyard-caddy/Caddyfile;
             if [ ! -f "$$f" ] || { [ "$${SHIPYARD_HTTPS:-false}" = "false" ] && ! grep -q "auto_https off" "$$f" 2>/dev/null; }; then
               f=/bootstrap/Caddyfile;
             fi;
             exec caddy run --config "$$f" --adapter caddyfile'
    ports:
      - "80:80"
    volumes:
      - ./runtime/caddy/Caddyfile:/bootstrap/Caddyfile:ro
      - ${SHIPYARD_HOST_DATA:-/var/lib/shipyard}/caddy:/etc/shipyard-caddy:ro
      # Static deployments only; Caddy never sees the database or secrets.
      - ${SHIPYARD_HOST_DATA:-/var/lib/shipyard}/deployments:/var/lib/shipyard/deployments:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-admin:/run/caddy-admin
    networks: [shipyard]

networks:
  shipyard:
    name: shipyard

volumes:
  caddy-data:
  caddy-config:
  caddy-admin:
